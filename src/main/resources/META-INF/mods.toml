modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"
issueTrackerURL = "https://github.com/jiuzhong0613-sketch/mc-agent/issues"

[[mods]]
modId = "mcagent"
version = "0.3.3"
displayName = "MC Agent"
authors = "MC Agent contributors"
description = '''
Give an AI a body in Minecraft.

A client-side bridge that exposes structured game state and a semantic action API,
so an LLM (or any program) can play without screenshots or computer vision.
'''

clientSideOnly = true
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.mcagent]]
    modId = "forge"
    mandatory = true
    versionRange = "[47,)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.mcagent]]
    modId = "minecraft"
    mandatory = true
    versionRange = "[1.20.1,1.21)"
    ordering = "NONE"
    side = "CLIENT"
