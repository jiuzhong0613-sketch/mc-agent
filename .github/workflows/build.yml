name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Rename jar
        if: success()
        shell: bash
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          case "${{ matrix.os }}" in
            ubuntu-latest) OS=linux ;;
            windows-latest) OS=windows ;;
            macos-latest) OS=macos ;;
            *) OS=unknown ;;
          esac
          cd build/libs
          for f in *.jar; do
            cp "$f" "mc_agent-${MC}-forge-${OS}.jar"
          done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mc_agent-${{ matrix.os }}
          path: build/libs/mc_agent-*.jar
